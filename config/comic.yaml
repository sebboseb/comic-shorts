# Comic project configuration. One file per comic.

comic:
  title: "Annihilation"
  reading_direction: ltr        # ltr = western, rtl = manga
  pages_dir: "pages"            # folder of page images, sorted by filename

shorts:
  target_count: 2               # 5 pages -> 1-2 shorts for the e2e test
  min_seconds: 60
  max_seconds: 120              # room to pace properly rather than compress
  narrator_voice_id: "ELEVENLABS_VOICE_ID_HERE"

  # The narrator's PERSONA. This is the single biggest lever on how the
  # short feels -- it sets attitude and word choice, not just information.
  # Rewrite it freely; stage 4 is told to obey it over its own instincts.
  # single_voice: one narrator for the whole episode, character dialogue
  #   reported rather than performed. Matches how the reference channels work
  #   and is what lets an episode hold together at any length.
  # dialogue: characters get their own voices and verbatim lines (needs
  #   `principal: true` on the 2-4 who should speak).
  narration_mode: single_voice

  narration_style: |
    Irreverent, funny, and opinionated - a mate recapping a comic he loves
    and finds ridiculous. Chronically-online register: casual slang, dry
    asides, mock-outrage. You have takes and you share them. Rate people's
    decisions. Never neutral, never a museum audio guide, but never
    sneering at the comic either - the affection has to show.
  # narration pacing (ms). kokoro's own full-stop pause is ~420ms, which
  # reads as rushed; these are inserted by stage 6 instead.
  pause_ms: 380            # at . ! ?
  ellipsis_pause_ms: 560   # at ... (trailing off)
  # In single_voice mode there is no speaker change to punctuate, and beats
  # are short, so this gap is paid many more times per episode. Keep it small
  # or the narration stops feeling continuous the way the references do.
  shot_gap_ms: 180         # after each line, before the next shot
  speech_tempo: 1.15       # speeds the words only; pauses stay as set above
  captions: true           # every reference channel burns captions in
  part_badge: true         # "Part - N" chip top-left, from the short_id
  # How far the picture may travel per second, as a fraction of frame width.
  # A full traverse per shot reads as swooping past everything; this keeps the
  # move slow enough to settle on the focus point.
  drift_rate: 0.055
  # How much room to leave around the subject when framing a shot. The frame
  # is sized from the panel's focus_box, not from the panel: lower = tighter
  # on the subject, higher = more of the surrounding art.
  frame_tightness: 2.4
  # fit  - whole panel, letterboxed over a blurred copy of itself, Ken Burns
  #        move aimed at the focus box. Keeps the drawn composition intact.
  # fill - crop a frame-shaped window around the subject. Fills the screen but
  #        throws away everything outside it, neighbouring panels included.
  #        This is how every reference channel frames every shot (2026-07-31
  #        tiktoks/ analysis): art edge-to-edge, zero letterbox. Repeated
  #        panels re-frame per beat so each shot reads as a cut.
  frame_mode: fill
  caption_style:
    font: "/System/Library/Fonts/Supplemental/Impact.ttf"
    size_pct: 0.046        # of frame height
    uppercase: true
    outline_ratio: 9       # smaller number = thicker black outline
    shadow: true
    color: "#FFFFFF"       # narrator and anything unlisted
    position: center       # mid-frame, where the reference channels put them
    center_pct: 0.55       # text bottom lands at this fraction of height
    # a caption in the speaker's colour reinforces who is talking, which
    # matters when several characters share a register
    speaker_colors:
      Nova: "#4FC3F7"
      Nova_nohelmet: "#4FC3F7"
      Drax: "#AED581"
      Thanos: "#B388FF"
      Annihilus: "#66BB6A"
      Gamora: "#4DB6AC"
      Galactus: "#FFB74D"
      Exterpia: "#F06292"
      "Peter Quill": "#FF8A65"

  # Background music. Tracks are MPT's royalty-free library, which ships
  # unlabelled (output000.mp3...), so these are first-pass picks bucketed
  # by measured loudness, NOT by listening. Swap any filename after you
  # audition them.
  music_dir: "~/Dev/comicops/mpt-comic-kit/MoneyPrinterTurbo/resource/songs"
  music_volume: 0.11       # under the narration; 0 disables music
  music_by_mood:
    ominous: "output029.mp3"        # quietest
    melancholy: "output025.mp3"
    tense_buildup: "output017.mp3"
    playful: "output012.mp3"
    triumphant: "output015.mp3"
    action: "output004.mp3"         # loudest
    default: "output021.mp3"
  voicebox_profile: "Narrator"      # qwen Dylan; stage 6 default voice;
                                    # per-character
                                    # override with `voicebox_profile` below

# Character roster. The `ref_image` is a face crop you make yourself
# (config/characters/<file>.png) — this is the 5-minute tagging pass that
# makes speaker attribution dramatically more accurate.
# Planet Comics 69 test run: no ref crops yet, descriptions only.
characters:
  - name: "Nova"
    principal: true
    epithet: "our boy Rich / Nova, the galaxy's last space cop"
    voicebox_profile: "Nova"            # qwen Aiden
    ref_image: "nova.png"
    description: "Richard Rider, Nova: gold-and-blue helmeted human hero, Nova Force energy"
    speaking_style: "young human man, wry under pressure, wearing-thin bravado"
  - name: "Nova_nohelmet"
    principal: true
    epithet: "Rich with the helmet off / just Richard now"
    voicebox_profile: "Nova"            # same person, same voice
    ref_image: "nova_nohelmet.png"
    description: "the same man without the helmet: tired, unguarded, more human"
    speaking_style: "young human man, quieter and more tired, guard down"
  - name: "Peter Quill"
    principal: true
    epithet: "Quill, who absolutely thinks he's the main character"
    voicebox_profile: "Quill"           # qwen Eric
    description: "Peter Quill, Star-Lord: human, dark hair, coat, wry and insubordinate"
    speaking_style: "wry human smartass, fast and needling, hiding real worry"
  - name: "Drax"
    epithet: "Drax, subtlety's natural enemy"
    voicebox_profile: "Drax"            # qwen Dylan
    ref_image: "drax.png"
    description: "Drax the Destroyer: hulking grey-green brute, blades, minimal words"
    speaking_style: "enormous blunt killer, flat and unhurried, never raises his voice"
  - name: "Thanos"
    epithet: "Thanos, the big purple philosopher"
    voicebox_profile: "Thanos"          # qwen Uncle_Fu
    ref_image: "thanos.png"
    description: "Thanos: purple-skinned Titan, chin ridges, calm and imperious"
    speaking_style: "ancient Titan, unhurried and coldly amused, absolutely certain"
  - name: "Annihilus"
    principal: true
    epithet: "Annihilus, bug guy with a god complex"
    voicebox_profile: "Annihilus"       # qwen Ono_Anna (only preset left)
    ref_image: "annihilus.png"
    description: "Annihilus: insectoid warlord in green armour with the Cosmic Control Rod"
    speaking_style: "insectoid warlord, hissing and grandiose, allergic to being doubted"
  - name: "Gamora"
    principal: true
    epithet: "Gamora, deadliest woman in the galaxy and aware of it"
    voicebox_profile: "Gamora"          # qwen Serena
    ref_image: "gamora.png"
    description: "Gamora: green-skinned assassin, dark hair, lethal and guarded"
    speaking_style: "sharp-tongued assassin, clipped and dry, emotionally armoured"
  - name: "Galactus"
    epithet: "Galactus, who does not care about you"
    voicebox_profile: "Galactus"        # qwen Ryan
    ref_image: "galactus.png"
    description: "Galactus: colossal purple-armoured devourer of worlds, utterly detached"
    speaking_style: "vast and detached, thinks in geological time, never hurries"
  - name: "Exterpia"
    epithet: "Exterpia, Annihilus's number one fan"
    voicebox_profile: "Exterpia"        # qwen Sohee
    ref_image: "exterpia.png"
    description: "Exterpia: Annihilation Wave officer, loyal to Annihilus without question"
    speaking_style: "zealous officer, brisk and hard, no doubt in her anywhere"
models:
  vision_model: "claude-sonnet-4-6"   # stage 2 panel understanding (batched, ~$1/run)
  story_model: "claude-opus-4-8"      # stage 4 story compilation (one call, quality-critical)
  esrgan_weights: "weights/RealESRGAN_x4plus_anime_6B.pth"
  upscale_target_long_side: 2200      # px; panels below this get upscaled

stage1:
  detector: claude_boxes        # claude_boxes (vision API, cents/book, best on
                                # messy layouts) | floodfill (local, free,
                                # no-key fallback) | contour (legacy)
  min_panel_area_ratio: 0.02    # ignore contours smaller than 2% of page
  # white_threshold: 235        # optional fixed gutter cutoff; unset = derived
                                # per page (0.92 x p90 brightness), survives
                                # aged/faded paper
  crop_margin: 4                # px margin kept around each panel
